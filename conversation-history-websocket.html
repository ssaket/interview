<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Overlay - Live Conversation History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #2d2d2d, #404040);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            color: #4a9eff;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .connection-status.connected {
            background: #22c55e;
            color: white;
        }

        .connection-status.connecting {
            background: #f59e0b;
            color: white;
        }

        .connection-status.disconnected {
            background: #ef4444;
            color: white;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .provider-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .info-badge {
            background: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            border: 1px solid #555;
        }

        .info-badge.provider {
            background: #4a9eff;
            color: white;
        }

        .stats {
            text-align: center;
            color: #888;
            font-size: 0.9em;
        }

        .conversation {
            background: #2d2d2d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            min-height: 200px;
        }

        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            position: relative;
            opacity: 0;
            transform: translateY(10px);
            animation: slideIn 0.3s ease forwards;
        }

        .message.new {
            animation: slideInHighlight 0.6s ease forwards;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInHighlight {
            0% {
                opacity: 0;
                transform: translateY(10px);
                background: rgba(74, 158, 255, 0.2);
            }
            50% {
                background: rgba(74, 158, 255, 0.1);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                background: transparent;
            }
        }

        .message.user {
            background: #1e3a5f;
            border-left: 4px solid #4a9eff;
            margin-left: 0;
            margin-right: 60px;
        }

        .message.assistant {
            background: #2a4a2a;
            border-left: 4px solid #4ade80;
            margin-left: 60px;
            margin-right: 0;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .role {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .message.user .role {
            color: #4a9eff;
        }

        .message.assistant .role {
            color: #4ade80;
        }

        .timestamp {
            color: #888;
            font-size: 0.8em;
        }

        .content {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1em;
        }

        .content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.9em;
        }

        .content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
            font-family: 'Monaco', 'Consolas', monospace;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 1.1em;
        }

        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 20px;
            color: #555;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(74, 158, 255, 0.3);
        }

        .btn:hover {
            background: #3a8ee6;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(74, 158, 255, 0.4);
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn.secondary {
            background: #666;
            box-shadow: 0 2px 10px rgba(102, 102, 102, 0.3);
        }

        .btn.secondary:hover {
            background: #777;
            box-shadow: 0 4px 15px rgba(102, 102, 102, 0.4);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: #22c55e;
        }

        .notification.error {
            background: #ef4444;
        }

        .notification.info {
            background: #3b82f6;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .provider-info {
                flex-direction: column;
                align-items: center;
            }
            
            .message.user {
                margin-right: 20px;
            }
            
            .message.assistant {
                margin-left: 20px;
            }
            
            .controls {
                position: relative;
                bottom: auto;
                right: auto;
                justify-content: center;
                margin-top: 30px;
            }
        }

        .typing-indicator {
            display: none;
            padding: 15px;
            margin: 20px 60px 20px 0;
            background: #333;
            border-radius: 8px;
            color: #888;
        }

        .typing-indicator.show {
            display: block;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4a9eff;
            animation: typingPulse 1.4s ease-in-out infinite both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0s; }

        @keyframes typingPulse {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Live Conversation History</h1>
            <div class="connection-status" id="connection-status">
                <div class="status-indicator"></div>
                <span>Connecting...</span>
            </div>
            <div class="provider-info">
                <div class="info-badge provider" id="provider-badge">Loading...</div>
                <div class="info-badge" id="model-badge">Loading...</div>
                <div class="info-badge" id="session-badge">Loading...</div>
            </div>
            <div class="stats" id="stats">
                <span id="last-updated">Never updated</span> • 
                <span id="message-count">0 messages</span>
            </div>
        </div>

        <div class="conversation" id="conversation">
            <div class="empty-state" id="empty-state">
                <div class="icon">💬</div>
                <div>No conversation history yet.</div>
                <div style="margin-top: 10px; font-size: 0.9em; color: #666;">
                    Start a conversation with the DeepSeek Overlay app to see messages here in real-time.
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <span>AI is thinking</span>
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn secondary" id="clear-btn" onclick="clearHistory()" disabled>Clear History</button>
            <button class="btn" id="reconnect-btn" onclick="reconnect()">Reconnect</button>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        let ws = null;
        let currentHistory = [];
        let reconnectAttempts = 0;
        let maxReconnectAttempts = 5;
        let reconnectDelay = 1000;

        // WebSocket URL (will be replaced by server)
        const WS_URL = 'ws://localhost:0000';

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            connectWebSocket();
            
            // Handle page visibility changes
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && (!ws || ws.readyState !== WebSocket.OPEN)) {
                    connectWebSocket();
                }
            });
        });

        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                return;
            }

            updateConnectionStatus('connecting');
            
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = function(event) {
                    console.log('WebSocket connected');
                    updateConnectionStatus('connected');
                    reconnectAttempts = 0;
                    enableControls(true);
                    showNotification('Connected to live updates', 'success');
                };

                ws.onmessage = function(event) {
                    try {
                        const message = JSON.parse(event.data);
                        handleWebSocketMessage(message);
                    } catch (error) {
                        console.error('Failed to parse WebSocket message:', error);
                    }
                };

                ws.onclose = function(event) {
                    console.log('WebSocket disconnected');
                    updateConnectionStatus('disconnected');
                    enableControls(false);
                    
                    // Attempt to reconnect
                    if (reconnectAttempts < maxReconnectAttempts) {
                        setTimeout(() => {
                            reconnectAttempts++;
                            showNotification(`Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`, 'info');
                            connectWebSocket();
                        }, reconnectDelay * reconnectAttempts);
                    } else {
                        showNotification('Connection lost. Click Reconnect to try again.', 'error');
                    }
                };

                ws.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    updateConnectionStatus('disconnected');
                    enableControls(false);
                };

            } catch (error) {
                console.error('Failed to connect WebSocket:', error);
                updateConnectionStatus('disconnected');
                enableControls(false);
            }
        }

        function handleWebSocketMessage(message) {
            switch (message.type) {
                case 'initial_history':
                case 'history_update':
                    updateHistory(message.data, message.type === 'history_update');
                    break;
                
                case 'pong':
                    console.log('Received pong from server');
                    break;
                
                case 'clear_acknowledged':
                    showNotification('History cleared', 'info');
                    break;
                
                default:
                    console.log('Unknown message type:', message.type);
            }
        }

        function updateHistory(historyData, isUpdate = false) {
            const hadPreviousHistory = currentHistory.length > 0;
            const previousLength = currentHistory.length;
            
            currentHistory = historyData.history || [];
            
            displayHistory(historyData, isUpdate && hadPreviousHistory);
            updateHeader(historyData);
            updateStats(historyData);
            
            // Show notification for new messages
            if (isUpdate && currentHistory.length > previousLength) {
                const newMessageCount = currentHistory.length - previousLength;
                showNotification(`${newMessageCount} new message${newMessageCount > 1 ? 's' : ''}`, 'success');
            }
        }

        function displayHistory(historyData, highlightNew = false) {
            const conversationElement = document.getElementById('conversation');
            const emptyStateElement = document.getElementById('empty-state');

            if (!historyData.history || historyData.history.length === 0) {
                emptyStateElement.style.display = 'block';
                conversationElement.innerHTML = '';
                conversationElement.appendChild(emptyStateElement);
                return;
            }

            emptyStateElement.style.display = 'none';
            conversationElement.innerHTML = '';

            historyData.history.forEach((message, index) => {
                const isNew = highlightNew && index >= (historyData.history.length - (historyData.history.length - currentHistory.length));
                const messageElement = createMessageElement(message, index, isNew);
                conversationElement.appendChild(messageElement);
            });

            // Scroll to bottom smoothly
            setTimeout(() => {
                conversationElement.scrollTop = conversationElement.scrollHeight;
            }, 100);
        }

        function createMessageElement(message, index, isNew = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.role}${isNew ? ' new' : ''}`;

            const timestamp = new Date().toLocaleString();
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <div class="role">${message.role === 'user' ? '👤 User' : '🤖 Assistant'}</div>
                    <div class="timestamp">${timestamp}</div>
                </div>
                <div class="content">${formatContent(message.content)}</div>
            `;

            return messageDiv;
        }

        function formatContent(content) {
            if (!content) return '';
            
            // Basic markdown-like formatting
            content = content
                .replace(/```([^`]+)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');

            return content;
        }

        function updateHeader(historyData) {
            document.getElementById('provider-badge').textContent = `Provider: ${historyData.provider}`;
            document.getElementById('model-badge').textContent = `Model: ${historyData.model}`;
            document.getElementById('session-badge').textContent = `Session: ${historyData.sessionStats.isActive ? 'Active' : 'Inactive'}`;
        }

        function updateStats(historyData) {
            const lastUpdated = historyData.lastUpdated 
                ? new Date(historyData.lastUpdated).toLocaleString()
                : 'Never';
            
            document.getElementById('last-updated').textContent = `Updated: ${lastUpdated}`;
            document.getElementById('message-count').textContent = `${historyData.history.length} messages`;
        }

        function updateConnectionStatus(status) {
            const statusElement = document.getElementById('connection-status');
            const statusText = statusElement.querySelector('span');
            
            statusElement.className = `connection-status ${status}`;
            
            switch (status) {
                case 'connected':
                    statusText.textContent = 'Live Connected';
                    break;
                case 'connecting':
                    statusText.textContent = 'Connecting...';
                    break;
                case 'disconnected':
                    statusText.textContent = 'Disconnected';
                    break;
            }
        }

        function enableControls(enabled) {
            document.getElementById('clear-btn').disabled = !enabled;
            document.getElementById('reconnect-btn').disabled = enabled;
        }

        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function clearHistory() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showNotification('Not connected to server', 'error');
                return;
            }

            if (confirm('Are you sure you want to clear the conversation history? This action cannot be undone.')) {
                ws.send(JSON.stringify({
                    type: 'clear_history',
                    timestamp: new Date().toISOString()
                }));
            }
        }

        function reconnect() {
            reconnectAttempts = 0;
            if (ws) {
                ws.close();
            }
            connectWebSocket();
        }

        // Periodic ping to keep connection alive
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'ping',
                    timestamp: new Date().toISOString()
                }));
            }
        }, 30000); // Every 30 seconds

        // Handle page unload
        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
