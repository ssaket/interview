<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek Overlay Helper - CodeMirror Interface</title>
    <meta name="description" content="AI-powered coding interview assistant with CodeMirror text interface">
    <style>
      /* Minimal reset only */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: transparent; overflow: hidden; }
      #codemirror-container { width: 100%; height: 100vh; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- Main CodeMirror container -->
    <div id="codemirror-container">
      <!-- Loading screen shown during initialization -->
      <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Initializing CodeMirror Interface</div>
        <div class="loading-subtext">Setting up AI-powered coding assistant...</div>
      </div>
    </div>


    <!-- Core scripts -->
    <script>
      // Theme initialization
      function initializeTheme() {
        const savedTheme = localStorage.getItem('codemirror-theme');
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme ? savedTheme === 'dark' : systemDark;

        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      }

      // Error handling
      function showError(message, details) {
        const container = document.getElementById('codemirror-container');
        container.innerHTML = `
          <div class="error-display">
            <h2>❌ CodeMirror Interface Error</h2>
            <p><strong>Message:</strong> ${message}</p>
            ${details ? `<p><strong>Details:</strong> ${details}</p>` : ''}
            <p><strong>Solution:</strong> Please check the console for more information and try refreshing the application.</p>
          </div>
        `;
      }

      // Hide loading screen
      function hideLoadingScreen() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.display = 'none';
        }
      }

      // Global error handler
      window.addEventListener('error', (event) => {
        console.error('Global error:', event.error);
        showError('Application Error', event.error?.message || 'Unknown error occurred');
      });

      // Initialize theme immediately
      initializeTheme();

      console.log('🚀 CodeMirror interface HTML loaded');
    </script>
    <!-- Main CodeMirror renderer -->
    <script src="src/js/codemirror-renderer.js"></script>
  </body>
</html>
