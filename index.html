<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Overlay DeepSeek Helper</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                background: transparent;
                overflow: hidden;
                height: 100%;
            }
            #container {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.3);
                color: #eee;
                font-family: sans-serif;
                padding: 10px;
                user-select: none;
                overflow-y: auto;
                box-sizing: border-box;
            }
            #output {
                white-space: pre-wrap;
                margin-top: 10px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, sans-serif;
                line-height: 1.6;
            }
            #screenshot {
                max-width: 100%;
                margin-top: 10px;
                border: 1px solid #555;
            }
            p {
                margin: 5px 0;
            }

            /* Formatter styles */
            .formatted-response {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, sans-serif;
                line-height: 1.6;
                color: #e0e0e0;
            }

            .response-header {
                color: #4da6ff;
                margin: 16px 0 8px 0;
                font-weight: 600;
            }

            .code-section {
                margin: 12px 0;
                border-radius: 6px;
                overflow: hidden;
                background: rgba(40, 44, 52, 0.8);
                border: 1px solid #444;
            }

            .code-language {
                background: rgba(70, 130, 180, 0.2);
                color: #87ceeb;
                padding: 4px 12px;
                font-size: 12px;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .code-block {
                margin: 0;
                padding: 12px;
                background: transparent;
                overflow-x: auto;
                font-family: "SF Mono", "Monaco", "Cascadia Code",
                    "Roboto Mono", monospace;
                font-size: 13px;
                line-height: 1.4;
            }

            .code-block code {
                background: transparent;
                padding: 0;
                border: none;
                color: #e0e0e0;
            }

            .keyword {
                color: #ff79c6;
                font-weight: 500;
            }
            .string {
                color: #f1fa8c;
            }
            .number {
                color: #bd93f9;
            }
            .comment {
                color: #6272a4;
                font-style: italic;
            }

            .complexity-section {
                background: rgba(76, 175, 80, 0.1);
                border-left: 3px solid #4caf50;
                padding: 8px 12px;
                margin: 8px 0;
                border-radius: 4px;
            }

            .complexity {
                color: #4caf50;
                font-weight: 600;
            }

            .text-section {
                margin: 8px 0;
                line-height: 1.6;
            }

            .inline-code {
                background: rgba(255, 255, 255, 0.1);
                color: #ff79c6;
                padding: 2px 4px;
                border-radius: 3px;
                font-family: "SF Mono", "Monaco", "Cascadia Code",
                    "Roboto Mono", monospace;
                font-size: 0.9em;
            }

            .text-section strong {
                color: #fff;
                font-weight: 600;
            }

            .text-section em {
                color: #ccc;
                font-style: italic;
            }

            /* Code highlighting in plain text */
            .code-highlight {
                background: rgba(40, 44, 52, 0.8);
                border: 1px solid #444;
                border-radius: 4px;
                padding: 8px;
                margin: 8px 0;
                font-family: "SF Mono", "Monaco", "Cascadia Code",
                    "Roboto Mono", monospace;
                font-size: 13px;
                overflow-x: auto;
            }

            /* Complexity highlighting */
            .complexity-highlight {
                color: #4caf50;
                font-weight: 600;
                background: rgba(76, 175, 80, 0.1);
                padding: 2px 4px;
                border-radius: 3px;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <h2>Overlay DeepSeek Helper</h2>
            <p>Press ⌘+Shift+S to capture screen</p>
            <p>Use ⌘+←/→/↑/↓ to move window</p>
            <p>Press ⌘+B to hide/show app</p>
            <div id="output">Waiting for action...</div>
            <img id="screenshot" style="display: none" />
        </div>
        <script src="renderer.js"></script>
    </body>
</html>
