<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Overlay DeepSeek Helper</title>
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/formatter.css" />
    </head>
    <body>
        <div id="container">
            <h2>Overlay DeepSeek Helper</h2>
            <p>Press ⌘+Shift+S to capture screen</p>
            <p>Press ⌘+Shift+A to capture behind overlay</p>
            <p>Use ⌘+←/→/↑/↓ to move window</p>
            <p>Press ⌘+B to hide/show app</p>
            <p>Press ⌘+Shift+R to reset session</p>
            <div id="output">Waiting for action...</div>
            <img id="screenshot" style="display: none" />
        </div>
        <script src="js/renderer.js"></script>
    </body>
</html>
